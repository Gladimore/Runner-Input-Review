<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe Log — Runner Input Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --track-navy:   #0c1c2e;
    --track-navy-2: #122A44;
    --rail-steel:   #2a3f58;
    --signal-amber: #ffb020;
    --go-green:     #38d996;
    --stop-coral:   #ff5c5c;
    --paper:        #eef1f0;
    --paper-dim:    #a9b6c4;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --disp: 'Rajdhani', 'Arial Narrow', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 48px),
      linear-gradient(160deg, var(--track-navy) 0%, #081422 100%);
    color:var(--paper);
    font-family:var(--disp);
    min-height:100vh;
    padding:28px 20px 60px;
  }

  .wrap{max-width:1180px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    border-bottom:2px solid var(--rail-steel);
    padding-bottom:16px;
    margin-bottom:26px;
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand .mark{
    font-family:var(--mono);
    font-size:13px;
    color:var(--track-navy);
    background:var(--signal-amber);
    padding:3px 8px;
    border-radius:3px;
    letter-spacing:1px;
    font-weight:700;
  }
  h1{
    font-size:34px;
    font-weight:700;
    letter-spacing:0.5px;
    margin:0;
    text-transform:uppercase;
  }
  .sub{color:var(--paper-dim);font-family:var(--mono);font-size:13px;margin-top:2px;}
  .stat-strip{display:flex;gap:22px;font-family:var(--mono);font-size:13px;color:var(--paper-dim);}
  .stat-strip b{color:var(--signal-amber);font-size:20px;display:block;font-family:var(--disp);}

  .grid{
    display:grid;
    grid-template-columns:minmax(280px,420px) 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:linear-gradient(180deg, var(--track-navy-2), #0e2036);
    border:1px solid var(--rail-steel);
    border-radius:10px;
    padding:18px;
  }
  .panel h2{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--paper-dim);
    margin:0 0 14px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2::before{
    content:"";
    width:8px;height:8px;border-radius:2px;
    background:var(--signal-amber);
    display:inline-block;
  }

  /* ---- video / HUD ---- */
  .stage{
    position:relative;
    width:100%;
    border-radius:8px;
    overflow:hidden;
    background:#000;
    border:1px solid var(--rail-steel);
    aspect-ratio: 9 / 16;
  }
  video{width:100%;height:100%;object-fit:contain;display:block;background:#000;}

  .hud{
    position:absolute;
    top:12px;right:12px;
    display:flex;
    gap:6px;
    font-family:var(--mono);
    pointer-events:none;
  }
  .hud .cell{
    width:34px;height:34px;
    border-radius:6px;
    background:rgba(8,16,26,0.7);
    border:1px solid rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    color:rgba(255,255,255,0.28);
    transition:transform .08s ease, background .12s ease, color .12s ease, border-color .12s ease;
  }
  .hud .cell.hit{
    background:var(--signal-amber);
    color:var(--track-navy);
    border-color:var(--signal-amber);
    transform:scale(1.18);
  }

  .flash-frame{
    position:absolute;inset:0;
    border:0px solid var(--signal-amber);
    pointer-events:none;
    transition:border-width .1s ease, opacity .25s ease;
    opacity:0;
  }
  .flash-frame.on{ border-width:5px; opacity:1; }

  .video-controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .fps-field{
    display:flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:12px;color:var(--paper-dim);
  }
  .fps-field input{
    width:56px;
    background:var(--track-navy);
    border:1px solid var(--rail-steel);
    color:var(--paper);
    border-radius:4px;
    padding:5px 6px;
    font-family:var(--mono);
    font-size:12px;
  }

  .upload-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .upload-btn{
    flex:1;
    min-width:140px;
    position:relative;
    text-align:center;
    padding:10px 10px;
    border-radius:6px;
    border:1px dashed var(--rail-steel);
    color:var(--paper-dim);
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .upload-btn:hover{border-color:var(--signal-amber);color:var(--signal-amber);background:rgba(255,176,32,0.06);}
  .upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .reset-link{
    font-family:var(--mono);font-size:11px;color:var(--paper-dim);
    background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;
  }
  .reset-link:hover{color:var(--stop-coral);}

  /* ---- list ---- */
  .list-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;
  }
  .count-pill{
    font-family:var(--mono);font-size:12px;color:var(--paper-dim);
  }
  .count-pill b{color:var(--go-green);}

  .list-scroll{
    max-height:520px;
    overflow-y:auto;
    border:1px solid var(--rail-steel);
    border-radius:8px;
  }
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13.5px;}
  thead th{
    position:sticky;top:0;
    background:#0a1929;
    text-align:left;
    padding:9px 12px;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--paper-dim);
    border-bottom:1px solid var(--rail-steel);
    z-index:1;
  }
  tbody tr{
    border-bottom:1px solid rgba(255,255,255,0.05);
    cursor:pointer;
    transition:background .1s ease;
  }
  tbody tr:hover{background:rgba(255,255,255,0.04);}
  tbody tr.active{background:rgba(255,176,32,0.14);}
  tbody tr.removing{opacity:0;transform:translateX(12px);}
  td{padding:8px 12px;vertical-align:middle;}
  .idx-col{color:var(--paper-dim);width:44px;}
  .frame-col{color:var(--paper-dim);width:70px;}
  .dir-col{display:flex;align-items:center;gap:8px;}
  .arrow-badge{
    width:22px;height:22px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
    background:var(--track-navy);border:1px solid var(--rail-steel);
  }
  .dir-up .arrow-badge{color:var(--go-green);border-color:var(--go-green);}
  .dir-down .arrow-badge{color:var(--stop-coral);border-color:var(--stop-coral);}
  .dir-left .arrow-badge,.dir-right .arrow-badge{color:var(--signal-amber);border-color:var(--signal-amber);}
  .rm-col{width:36px;text-align:right;}
  .rm-btn{
    background:none;border:none;color:var(--paper-dim);
    font-size:16px;cursor:pointer;line-height:1;padding:4px 6px;border-radius:4px;
    transition:color .12s,background .12s;
  }
  .rm-btn:hover{color:var(--stop-coral);background:rgba(255,92,92,0.1);}

  .empty-row td{
    text-align:center;color:var(--paper-dim);padding:30px 12px;
  }

  .actions{
    display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;
  }
  .btn{
    font-family:var(--disp);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    font-size:14px;
    padding:11px 18px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    transition:transform .08s ease, filter .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--signal-amber);color:var(--track-navy);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--paper-dim);border:1px solid var(--rail-steel);}
  .btn-ghost:hover{color:var(--paper);border-color:var(--paper-dim);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--rail-steel);border-radius:6px;}

  .foot-note{
    font-family:var(--mono);
    font-size:11px;
    color:var(--paper-dim);
    margin-top:24px;
    text-align:center;
    opacity:0.7;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand">
        <span class="mark">SWIPE LOG</span>
      </div>
      <h1>Runner Input Review</h1>
      <div class="sub">frame-synced swipe capture · trim, verify, export</div>
    </div>
    <div class="stat-strip">
      <div>ENTRIES<b id="statCount">0</b></div>
      <div>FPS<b id="statFps">24</b></div>
      <div>CLIP<b id="statDur">0:00</b></div>
    </div>
  </header>

  <div class="grid">

    <!-- LEFT: video -->
    <div class="panel">
      <h2>Session Playback</h2>
      <div class="stage" id="stage">
        <video id="video" src="session.mov" controls playsinline muted></video>
        <div class="flash-frame" id="flashFrame"></div>
        <div class="hud" id="hud">
          <div class="cell" data-dir="0">↑</div>
          <div class="cell" data-dir="1">↓</div>
          <div class="cell" data-dir="2">←</div>
          <div class="cell" data-dir="3">→</div>
        </div>
      </div>

      <div class="video-controls">
        <label class="fps-field">
          VIDEO FPS
          <input type="number" id="fpsInput" value="24" min="1" step="0.001">
        </label>
      </div>

      <div class="upload-row">
        <label class="upload-btn">Upload custom video
          <input type="file" id="videoUpload" accept="video/*">
        </label>
        <label class="upload-btn">Upload custom swipes.csv
          <input type="file" id="csvUpload" accept=".csv,text/csv">
        </label>
      </div>
      <div style="margin-top:10px;">
        <button class="reset-link" id="resetBtn">reset to default session</button>
      </div>
    </div>

    <!-- RIGHT: list -->
    <div class="panel">
      <div class="list-head">
        <h2 style="margin:0;">Swipe Entries</h2>
        <div class="count-pill"><b id="listCount">0</b> loaded</div>
      </div>

      <div class="list-scroll">
        <table>
          <thead>
            <tr>
              <th class="idx-col">#</th>
              <th class="frame-col">Frame</th>
              <th>Direction</th>
              <th class="rm-col"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="downloadBtn">Download swipes.csv</button>
        <button class="btn btn-ghost" id="undoBtn" disabled>Undo remove</button>
      </div>
    </div>

  </div>

  <div class="foot-note">0 = up · 1 = down · 2 = left · 3 = right — click a row to jump the clip to that frame</div>
</div>

<script>
(function(){
  const DIR_NAMES  = ['Up','Down','Left','Right'];
  const DIR_ARROWS = ['↑','↓','←','→'];
  const DIR_CLASS  = ['dir-up','dir-down','dir-left','dir-right'];

  const DEFAULT_CSV = `frame,swipe
122,1
179,1
245,0
278,2
302,3
339,1
371,2
383,1
395,3
411,1
463,1
487,2
498,3
516,1
586,1
616,2
628,1
639,3
656,0
684,0
716,2
738,3
763,1
766,0
796,2
818,3
865,1
917,1
985,1
1013,3
1027,0
1037,2
1055,1
1085,1
1114,2
1139,3
1245,0
1252,3
1263,1
1272,2
1285,1
1292,2
1299,1
1310,3
1322,1
1331,3
1345,0
1359,2
1364,2
1371,1
1382,3
1392,3
1397,1
1421,1
1433,2
1449,0
1474,1
1494,2
1513,3
1526,0
1550,1
1567,2
1588,3
1596,3
1613,1
1630,2
`;

  const els = {
    video: document.getElementById('video'),
    stage: document.getElementById('stage'),
    flashFrame: document.getElementById('flashFrame'),
    hud: document.getElementById('hud'),
    fpsInput: document.getElementById('fpsInput'),
    videoUpload: document.getElementById('videoUpload'),
    csvUpload: document.getElementById('csvUpload'),
    resetBtn: document.getElementById('resetBtn'),
    tableBody: document.getElementById('tableBody'),
    listCount: document.getElementById('listCount'),
    downloadBtn: document.getElementById('downloadBtn'),
    undoBtn: document.getElementById('undoBtn'),
    statCount: document.getElementById('statCount'),
    statFps: document.getElementById('statFps'),
    statDur: document.getElementById('statDur'),
  };

  let swipes = [];      // {frame, swipe}
  let fps = 24;
  let lastRemoved = null; // {item, index} for undo
  let activeRowEl = null;
  let rafId = null;

  function parseCSV(text){
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length);
    if (!lines.length) return [];
    let start = 0;
    // skip header if present (non-numeric first column)
    const firstCells = lines[0].split(',');
    if (isNaN(parseFloat(firstCells[0]))) start = 1;
    const out = [];
    for (let i = start; i < lines.length; i++){
      const parts = lines[i].split(',');
      if (parts.length < 2) continue;
      const frame = parseInt(parts[0], 10);
      const swipe = parseInt(parts[1], 10);
      if (Number.isNaN(frame) || Number.isNaN(swipe)) continue;
      out.push({ frame, swipe });
    }
    out.sort((a,b) => a.frame - b.frame);
    return out;
  }

  function loadSwipes(text){
    swipes = parseCSV(text);
    lastRemoved = null;
    els.undoBtn.disabled = true;
    renderList();
  }

  function fmtTime(t){
    if (!isFinite(t)) return '0:00';
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function renderList(){
    els.tableBody.innerHTML = '';
    if (!swipes.length){
      const tr = document.createElement('tr');
      tr.className = 'empty-row';
      tr.innerHTML = `<td colspan="4">No swipe entries loaded</td>`;
      els.tableBody.appendChild(tr);
    } else {
      swipes.forEach((s, i) => {
        const tr = document.createElement('tr');
        tr.dataset.index = i;
        tr.innerHTML = `
          <td class="idx-col">${i}</td>
          <td class="frame-col">${s.frame}</td>
          <td class="${DIR_CLASS[s.swipe] || ''}">
            <div class="dir-col">
              <span class="arrow-badge">${DIR_ARROWS[s.swipe] ?? '?'}</span>
              <span>${DIR_NAMES[s.swipe] ?? 'Unknown'}</span>
            </div>
          </td>
          <td class="rm-col"><button class="rm-btn" title="Remove entry" data-action="remove">✕</button></td>
        `;
        tr.addEventListener('click', (e) => {
          if (e.target.closest('[data-action="remove"]')) return;
          seekToFrame(s.frame);
        });
        tr.querySelector('[data-action="remove"]').addEventListener('click', (e) => {
          e.stopPropagation();
          removeAt(i);
        });
        els.tableBody.appendChild(tr);
      });
    }
    els.listCount.textContent = swipes.length;
    els.statCount.textContent = swipes.length;
  }

  function removeAt(index){
    const row = els.tableBody.querySelector(`tr[data-index="${index}"]`);
    lastRemoved = { item: swipes[index], index };
    els.undoBtn.disabled = false;
    const doRemove = () => {
      swipes.splice(index, 1);
      renderList();
    };
    if (row){
      row.classList.add('removing');
      setTimeout(doRemove, 140);
    } else {
      doRemove();
    }
  }

  els.undoBtn.addEventListener('click', () => {
    if (!lastRemoved) return;
    swipes.splice(lastRemoved.index, 0, lastRemoved.item);
    swipes.sort((a,b) => a.frame - b.frame);
    lastRemoved = null;
    els.undoBtn.disabled = true;
    renderList();
  });

  function seekToFrame(frame){
    const t = frame / fps;
    if (isFinite(t)){
      els.video.currentTime = t;
    }
  }

  function updateFps(v){
    const n = parseFloat(v);
    if (n > 0){
      fps = n;
      els.statFps.textContent = n;
    }
  }
  els.fpsInput.addEventListener('input', () => updateFps(els.fpsInput.value));

  // ---- HUD sync loop ----
  const WINDOW = 0.18; // seconds either side of a swipe's timestamp counts as "hit"

  function findActive(t){
    // binary-ish scan is fine at this scale
    for (let i = 0; i < swipes.length; i++){
      const st = swipes[i].frame / fps;
      if (Math.abs(st - t) <= WINDOW) return i;
      if (st > t + WINDOW) break;
    }
    return -1;
  }

  function tick(){
    const t = els.video.currentTime;
    const idx = findActive(t);

    els.hud.querySelectorAll('.cell').forEach(c => c.classList.remove('hit'));
    if (idx !== -1){
      const dir = swipes[idx].swipe;
      const cell = els.hud.querySelector(`.cell[data-dir="${dir}"]`);
      if (cell) cell.classList.add('hit');
      els.flashFrame.classList.add('on');
    } else {
      els.flashFrame.classList.remove('on');
    }

    if (idx !== -1){
      const row = els.tableBody.querySelector(`tr[data-index="${idx}"]`);
      if (row && row !== activeRowEl){
        if (activeRowEl) activeRowEl.classList.remove('active');
        row.classList.add('active');
        row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        activeRowEl = row;
      }
    } else if (activeRowEl){
      activeRowEl.classList.remove('active');
      activeRowEl = null;
    }

    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);

  els.video.addEventListener('loadedmetadata', () => {
    els.statDur.textContent = fmtTime(els.video.duration);
  });

  // ---- uploads ----
  els.videoUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    els.video.src = url;
    els.video.load();
  });

  els.csvUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => loadSwipes(ev.target.result);
    reader.readAsText(file);
  });

  els.resetBtn.addEventListener('click', () => {
    els.video.src = 'session.mov';
    els.video.load();
    els.fpsInput.value = 24;
    updateFps(24);
    loadSwipes(DEFAULT_CSV);
  });

  // ---- download ----
  els.downloadBtn.addEventListener('click', () => {
    const header = 'frame,swipe\n';
    const body = swipes.map(s => `${s.frame},${s.swipe}`).join('\n');
    const blob = new Blob([header + body + (body ? '\n' : '')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'swipes.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  // ---- init ----
  updateFps(24);
  loadSwipes(DEFAULT_CSV);
})();
</script>
</body>
</html>
